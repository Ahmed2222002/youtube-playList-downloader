<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />

    <link rel="stylesheet" href="style.css" />
    <title>Welcome to Free PlayList Downloader</title>
  </head>
  <body>
    <div id="mainContainer">
      <div id="inputContainer">
        <div id="fetchContainer">
          <input type="text" id="urlInput" placeholder="Enter the URL" />
          <button id="FetchButton">Fetch</button>
        </div>

        <div id="optionsContainer">
          <label for="filter">Filter:</label>
          <select id="filter" name="filter">
            <option value="mergevideo" selected>video</option>
            <option value="audioonly">audio</option>
          </select>
          <label for="quality">Quality:</label>
          <select id="quality" name="quality">
            <option value="144p">144p</option>
            <option value="240p">240p</option>
            <option value="360p">360p</option>
            <option value="720p">720p</option>
            <option value="1080p">1080p</option>
            <option value="1440p">1440p</option>
            <option value="2160p">2160p</option>
            <option value="highest" selected>highest</option>
            <option value="lowest">lowest</option>
          </select>

          <label for="path">Path:</label>
          <button id="pathButton" value="C:\free playlist downloader\">
            Browse
          </button>
        </div>
      </div>

      <div id="outputContainer"></div>

      <div id="controls">
        <button id="startButton">Start</button>
      </div>

      <div id="loading" style="display: none">
        <p>⏳ Please wait...</p>
      </div>
    </div>
  </body>
  <script src="../src/renderer.js"></script>
</html>
